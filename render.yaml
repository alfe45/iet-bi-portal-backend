# Blueprint de Render: API (Docker). La base de datos vive en Neon (ver README), no en Render.
# El servicio actual (iet-bi-portal-api) se creó desde el Dashboard con esta misma configuración; este archivo
# sirve para recrearlo. Aplicarlo con el servicio existente crea uno duplicado.
# Cada push a la rama develop redespliega la API (autoDeployTrigger: commit).
services:
  - type: web
    name: iet-bi-portal-api
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: CONFIAR_PROXY
        value: "true"
      # URL(s) del frontend separadas por comas, incluidos los orígenes locales (http://localhost:4200).
      - key: CORS_ORIGINS
        sync: false

      # Neon: endpoint directo (sin -pooler) y la cuenta svc_api creada por 01_roles_schemas.sql.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: ietbi
      - key: DB_USER
        value: svc_api
      - key: DB_PASSWORD
        sync: false

      - key: JWT_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: iet-bi-portal-api
      - key: JWT_AUDIENCE
        value: iet-bi-portal-frontend
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"

      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "2"
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true
