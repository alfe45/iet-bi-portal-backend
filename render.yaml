# Blueprint de Render: API (Docker) + PostgreSQL administrado.
# Cada push a la rama develop redespliega la API (autoDeployTrigger: commit).
# La base se crea vacía: los scripts Resources/sql/01..19 se ejecutan una sola vez a mano (ver README).
services:
  - type: web
    name: iet-bi-portal-api
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: CONFIAR_PROXY
        value: "true"
      # URL(s) del frontend separadas por comas; se llena en el Dashboard.
      - key: CORS_ORIGINS
        sync: false

      - key: DB_HOST
        fromDatabase:
          name: iet-bi-portal-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iet-bi-portal-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: iet-bi-portal-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: iet-bi-portal-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iet-bi-portal-db
          property: password

      - key: JWT_KEY
        generateValue: true
      - key: JWT_ISSUER
        value: iet-bi-portal-api
      - key: JWT_AUDIENCE
        value: iet-bi-portal-frontend
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"

      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "2"
      - key: ADMIN_BOOTSTRAP_TOKEN
        generateValue: true

databases:
  - name: iet-bi-portal-db
    databaseName: ietbi
    plan: free
    region: virginia
    postgresMajorVersion: "18"

